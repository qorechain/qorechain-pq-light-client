# SPDX-License-Identifier: Apache-2.0
name: ci-go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Fuzz the decoders
        run: |
          go test -run '^$' -fuzz '^FuzzDecodeSignedCheckpoint$' -fuzztime 60s
          go test -run '^$' -fuzz '^FuzzDecodeValidatorSet$' -fuzztime 30s
          go test -run '^$' -fuzz '^FuzzDecodeCheckpoint$' -fuzztime 30s
